<p class="small text-muted mb-2">Review the rejection email below, edit if needed, then send.</p>
<form method="post" action="{% url 'candidate_send_rejection' candidate.pk %}" data-step="send-rejection">
  {% csrf_token %}
  <input type="hidden" name="next" value="">
  <input type="hidden" name="performed_by" value="">
  <input type="hidden" name="reason" value="">
  <div class="mb-2">
    <label class="form-label small mb-1">To</label>
    <input type="email" name="to_email" class="form-control form-control-sm" value="{{ to_email }}">
  </div>
  <div class="mb-2">
    <label class="form-label small mb-1">CC <span class="text-muted">(fixed - not editable)</span></label>
    <input type="text" class="form-control form-control-sm" value="{{ cc_emails|join:", "|default:"None" }}" readonly>
  </div>
  <div class="mb-2">
    <label class="form-label small mb-1">Subject</label>
    <input type="text" name="subject" class="form-control form-control-sm" value="{{ subject }}">
  </div>
  <div class="mb-3">
    <label class="form-label small mb-1">Message</label>
    <textarea name="body" class="form-control" rows="12">{{ body }}</textarea>
  </div>
  <div id="rejectionSendError" class="alert alert-danger py-2 small mb-3" hidden></div>
  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-app" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-fill-app" {% if not to_email %}disabled title="No candidate email to send to"{% endif %}>
      <i class="bi bi-send"></i> Reject &amp; Send Email
    </button>
  </div>
</form>
