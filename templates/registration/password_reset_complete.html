{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset - HireB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="{% static 'css/theme.css' %}?v=2" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; background: #fff; }
  .login-shell { display: flex; min-height: 100vh; }
  .login-brand { width: 42%; min-width: 320px; background: var(--dark-green, #006666); color: #fff; padding: 44px 40px; display: flex; flex-direction: column; }
  .login-brand-mark { display: flex; align-items: center; gap: 11px; }
  .login-brand-mark .badge-mark { width: 34px; height: 34px; border-radius: 7px; background: rgba(255,255,255,.18); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; letter-spacing: .02em; }
  .login-brand-mark .brand-name { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .login-brand-tagline { margin-top: auto; }
  .login-brand-tagline h1 { font-weight: 600; font-size: 30px; line-height: 1.25; margin: 0; }
  .login-brand-tagline p { font-weight: 400; font-size: 13.5px; line-height: 1.8; color: rgba(255,255,255,.75); margin: 14px 0 0; }
  .login-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 44px 32px; }
  .login-form-wrap { width: 100%; max-width: 360px; }
  .login-form-wrap h2 { font-weight: 700; font-size: 25px; color: #1a2e35; margin: 0; }
  .login-form-wrap .subtitle { font-size: 13px; color: #7a8a90; margin: 8px 0 0; line-height: 1.6; }
  .login-submit { display: block; width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 8px; background: var(--dark-green, #006666); color: #fff; font-weight: 600; font-size: 14.5px; font-family: inherit; text-align: center; text-decoration: none; }
  .login-submit:hover { background: #004d4d; }
  @media (max-width: 860px) {
    .login-shell { flex-direction: column; }
    .login-brand { width: 100%; min-width: 0; padding: 32px 28px; }
    .login-brand-tagline { margin-top: 28px; }
    .login-panel { padding: 32px 24px; }
  }
</style>
</head>
<body>
<div class="login-shell">
  <div class="login-brand">
    <div class="login-brand-mark">
      <span class="badge-mark">H</span>
      <span class="brand-name">HireB</span>
    </div>
    <div class="login-brand-tagline">
      <h1>Your own HR partner.</h1>
      <p>Screening to final offer &mdash; your recruitment journey, made easier.</p>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-form-wrap">
      <h2>Password reset</h2>
      <p class="subtitle">Your password has been changed. Sign in with your new password below - this same page works whether you're HR or an Interviewer.</p>
      <a href="{% url 'login' %}" class="login-submit">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
